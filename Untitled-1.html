
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قلوب جهينة 💖</title>

<style>
*{box-sizing:border-box}
body{
margin:0;overflow:hidden;font-family:Tahoma,Arial;
background:radial-gradient(circle,#ff526f,#d80035 55%,#690019);
color:white
}
#game{position:fixed;inset:0;overflow:hidden}
header{text-align:center;position:absolute;top:15px;width:100%;z-index:5}
h1{font-size:35px;text-shadow:0 0 15px pink}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.stats span{background:#ffffff30;padding:10px;border-radius:20px}
button{padding:12px 20px;border:0;border-radius:25px;background:white;color:#b80032;font-weight:bold;cursor:pointer}
.item{position:absolute;top:-70px;cursor:pointer;animation:fall linear forwards;filter:drop-shadow(0 5px 10px #400015)}
.heart{font-size:45px}
.rose{font-size:40px}
.bomb{font-size:48px}
@keyframes fall{to{transform:translateY(120vh) rotate(360deg)}}
.particle{position:absolute;pointer-events:none;font-size:25px}
.namePop{position:absolute;color:white;font-size:35px;font-weight:bold;text-shadow:0 0 15px #fff,0 0 30px pink;pointer-events:none;animation:pop 1.5s forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}30%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-100px);opacity:0}}
#message{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);width:90%;padding:15px;background:white;color:#a00035;border-radius:25px;text-align:center;font-size:21px;font-weight:bold;z-index:5}
#warningScreen{display:none;position:absolute;inset:0;background:#25000bdc;z-index:20;align-items:center;justify-content:center;padding:20px}
.warningBox{background:linear-gradient(145deg,#fff,#ffe0eb);color:#a00035;text-align:center;padding:35px;border-radius:30px;border:4px solid #ff759f;box-shadow:0 0 40px #ff174e;max-width:600px}
.warningBox h2{font-size:30px;line-height:1.6}
.bombIcon{font-size:80px;animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
</style>
</head>

<body>
<div id="game">

<header>
<h1>💖 قلوب جهينة 💖</h1>
<p>اجمع القلوب والورود واحذر من القنابل!</p>
<div class="stats">
<span>النقاط: <b id="score">0</b></span>
<span>المستوى: <b id="level">1</b></span>
<button id="startBtn">ابدأ اللعب</button>
</div>
</header>

<div id="message">يا جهينة، لكل قلب حكاية جميلة 💕</div>

<div id="warningScreen">
<div class="warningBox">
<div class="bombIcon">💣</div>
<h2>يوجد بعض الدخلاء فالنحذر</h2>
<p>لقد ضغطت على قنبلة!</p>
<button id="restartBtn">العودة إلى اللعب 🌹</button>
</div>
</div>

</div>

<script>
const game=document.getElementById("game");
const scoreElement=document.getElementById("score");
const levelElement=document.getElementById("level");
const message=document.getElementById("message");
const warningScreen=document.getElementById("warningScreen");

let score=0,running=false,paused=false,timer;

const phrases=[
"يا جهينة، اسمك وردة في بستان الذكريات 🌹",
"لكِ باقة محبة وامتنان من القلب 💐",
"كل لحظة جميلة تستحق قلبًا يضيء 💖",
"جهينة… اسم يزهر كالفجر في الروح 🌸",
"أرسل لكِ مع كل قلب دعوة بالفرح ✨",
"لجهينة ألف وردة وأجمل الأمنيات 🌷",
"بعض الأسماء تترك في القلب نورًا 💗",
"شكراً لكل لحظة أضافت إلى يومنا جمالًا 🌼"
];

function startGame(){
score=0;
scoreElement.textContent=score;
levelElement.textContent=1;

game.querySelectorAll(".item,.particle,.namePop").forEach(e=>e.remove());

warningScreen.style.display="none";
running=true;
paused=false;

message.textContent="هيا نجمع القلوب والورود يا جهينة 💖";

clearInterval(timer);
timer=setInterval(()=>{
if(running&&!paused)createItem();
},750);
}

function createItem(){
const item=document.createElement("div");
item.className="item";

const random=Math.random();

if(random<0.15){
item.classList.add("bomb");
item.textContent="💣";
item.dataset.type="bomb";
}
else if(random<0.35){
item.classList.add("rose");
item.textContent="🌹";
item.dataset.type="rose";
}
else{
item.classList.add("heart");
item.textContent=["❤️","💖","💗","💘","💕"][Math.floor(Math.random()*5)];
item.dataset.type="heart";
}

item.style.left=Math.random()*90+"vw";
item.style.animationDuration=Math.max(2.5,5-score*.02)+"s";

item.onclick=()=>{
if(!running||paused)return;
if(item.dataset.type==="bomb")hitBomb(item);
else hitHeart(item);
};

item.onanimationend=()=>item.remove();
game.appendChild(item);
}

function hitHeart(item){
const rect=item.getBoundingClientRect();
const x=rect.left+rect.width/2;
const y=rect.top+rect.height/2;
const rose=item.dataset.type==="rose";

item.remove();
createExplosion(x,y);
showName(x,y);

score+=rose?2:1;
scoreElement.textContent=score;
levelElement.textContent=Math.floor(score/10)+1;

message.textContent=phrases[Math.floor(Math.random()*phrases.length)];

if(score%10===0){
message.textContent="💐 شكراً يا جهينة، لكل لحظة جميلة ولكل قلب 💖";
}
}

function createExplosion(x,y){
const decorations=["💖","💕","🌹","🌸","❤️","✨","💗","🌷"];

for(let i=0;i<30;i++){
const particle=document.createElement("div");
particle.className="particle";
particle.textContent=decorations[Math.floor(Math.random()*decorations.length)];
particle.style.left=x+"px";
particle.style.top=y+"px";
game.appendChild(particle);

const angle=Math.random()*Math.PI*2;
const distance=80+Math.random()*150;
const dx=Math.cos(angle)*distance;
const dy=Math.sin(angle)*distance;

particle.animate([
{transform:"translate(-50%,-50%) scale(.2)",opacity:1},
{transform:`translate(${dx}px,${dy}px) scale(1.4)`,opacity:0}
],{duration:1000+Math.random()*500,easing:"ease-out"});

setTimeout(()=>particle.remove(),1600);
}
}

function showName(x,y){
const name=document.createElement("div");
name.className="namePop";
name.textContent="جهينة 💖";
name.style.left=x+"px";
name.style.top=y+"px";
game.appendChild(name);
setTimeout(()=>name.remove(),1500);
}

function hitBomb(item){
item.remove();
running=false;
paused=true;
clearInterval(timer);
warningScreen.style.display="flex";
message.textContent="احذر من القنابل 💣";
}

document.getElementById("startBtn").onclick=startGame;
document.getElementById("restartBtn").onclick=startGame;
</script>

</body>
</html>
